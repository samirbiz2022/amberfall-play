<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ממלכת הענבר</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;900&display=swap">
<style>
  :root {
    --ground: #12180f;
    --card: #1d2617;
    --rim: #38471f;
    --amber: #f6b23c;
    --amber-deep: #b3500e;
    --ink: #f3efe2;
    --muted: #9aa88a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 22%, #22301a 0%, var(--ground) 70%);
    color: var(--ink);
    font-family: Rubik, "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: min(420px, 100%);
    background: var(--card);
    border: 2px solid var(--rim);
    border-radius: 22px;
    padding: 34px 28px 30px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }
  h1 {
    margin: 0 0 4px;
    font-weight: 900;
    font-size: clamp(30px, 8vw, 42px);
    letter-spacing: 0.02em;
    color: var(--amber);
    text-shadow: 0 3px 0 var(--amber-deep), 0 5px 14px rgba(0, 0, 0, 0.5);
  }
  p.sub { margin: 0 0 26px; color: var(--muted); font-size: 15px; }
  label { display: block; margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  input {
    width: 100%;
    padding: 14px 16px;
    font: inherit;
    font-size: 17px;
    text-align: center;
    color: var(--ink);
    background: #0e130c;
    border: 2px solid var(--rim);
    border-radius: 12px;
    outline: none;
  }
  input:focus { border-color: var(--amber); }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    font: inherit;
    font-weight: 900;
    font-size: 18px;
    color: #2a1804;
    background: linear-gradient(180deg, #ffd070, var(--amber) 55%, var(--amber-deep));
    border: 2px solid #6d3406;
    border-radius: 12px;
    cursor: pointer;
  }
  button:active { transform: translateY(2px); }
  .wrong { margin: 14px 0 0; min-height: 20px; color: #ff9095; font-size: 14px; }
  .note { margin: 22px 0 0; font-size: 12px; line-height: 1.6; color: #6f7d62; }
</style>
</head>
<body>
  <main class="card">
    <h1>ממלכת הענבר</h1>
    <p class="sub">גרסת פיתוח — לא לשיתוף</p>

    <form id="gate">
      <label for="pw">סיסמה</label>
      <input id="pw" type="password" autocomplete="off" autocapitalize="off"
             spellcheck="false" inputmode="text">
      <button type="submit">כניסה</button>
      <p class="wrong" id="wrong"></p>
    </form>

    <p class="note">המשחק נטען ישירות בדפדפן. בפעם הראשונה זה 23MB, אחר כך מהיר.</p>
  </main>

<script>
// The gate.
//
// The build sits in a public repository because GitHub only serves Pages from
// one on this plan, and this keeps it from being something a stranger wanders
// into. It stores a hash rather than the word itself, so the password is not
// sitting in the page in plain sight.
//
// It is a lock on an unlocked door, and worth being clear about: anyone who
// reads this file sees the hash, and anyone who guesses the game page's own
// name skips the gate entirely. It exists to keep an unfinished game out of the
// way of passers-by, which is what it was asked to do — not to protect
// anything that matters.
const EXPECTED = '649ebeb79cf5b457cb8a59e643cb7892f03a1d83ad0a5142bc7964ff21f65d28';
const KEY = 'amberfall-gate';

async function hash(text) {
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function enter() { location.replace('play.html'); }

// Remembered, so the password is asked once per device rather than every time
// he opens the link to look at something.
try { if (localStorage.getItem(KEY) === EXPECTED) enter(); } catch (e) {}

document.getElementById('gate').addEventListener('submit', async (e) => {
  e.preventDefault();
  const field = document.getElementById('pw');
  const wrong = document.getElementById('wrong');

  if (await hash(field.value.trim()) === EXPECTED) {
    try { localStorage.setItem(KEY, EXPECTED); } catch (e) {}
    enter();
  } else {
    wrong.textContent = 'סיסמה שגויה';
    field.value = '';
    field.focus();
  }
});
</script>
</body>
</html>
